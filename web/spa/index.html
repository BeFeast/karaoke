<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The MarqueeMark favicon — same sign as the extension icons, rendered
         from the exported vector (extension/chrome/icons/render-icons.mjs). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Karaoke</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong palette.
      try {
        var t = localStorage.getItem("karaoke-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
