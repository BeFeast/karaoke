<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Karaoke — Redesign Exploration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="karaoke-tokens.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="sections/brand.jsx"></script>
<script type="text/babel" src="sections/booth.jsx"></script>
<script type="text/babel" src="sections/stage.jsx"></script>
<script type="text/babel" src="sections/doorway.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="Karaoke — redesign exploration">
        <DCSection id="identity" title="1 · Framing & identity" subtitle="The split + the wipe — three directions, A carried forward">
          <DCArtboard id="framing" label="Brief — assumptions & reasoning" width={560} height={845}>
            <FramingBoard />
          </DCArtboard>
          <DCArtboard id="dir-a" label="A · Split Signal — lead" width={440} height={580}>
            <DirectionA />
          </DCArtboard>
          <DCArtboard id="dir-b" label="B · Marquee" width={390} height={345}>
            <DirectionB />
          </DCArtboard>
          <DCArtboard id="dir-c" label="C · Ink & Wipe" width={390} height={600}>
            <DirectionC />
          </DCArtboard>
        </DCSection>

        <DCSection id="booth" title="2 · The Booth — dashboard" subtitle="Light operator room · submit, feed, infra strip · no sidebar, one calm column">
          <DCArtboard id="dashboard" label="Dashboard · trusted LAN" width={1000} height={780}>
            <DashboardBoard />
          </DCArtboard>
        </DCSection>

        <DCSection id="stage" title="3 · The Stage — share page & performance mode" subtitle="Dark room · duet waveform, blend slider, synced lyrics">
          <DCArtboard id="share" label="Share page · /s/{token}" width={920} height={880}>
            <SharePageBoard />
          </DCArtboard>
          <DCArtboard id="performance" label="Performance mode · 16:9, TV across the room" width={960} height={540}>
            <PerformanceBoard />
          </DCArtboard>
        </DCSection>

        <DCSection id="doorway" title="4 · The Doorway — Chrome extension & brand assets" subtitle="Popup mini-feed, options, icons that survive 16px, notification voice">
          <DCArtboard id="popup" label="Extension popup" width={340} height={470}>
            <PopupBoard />
          </DCArtboard>
          <DCArtboard id="options" label="Options page" width={620} height={505}>
            <OptionsBoard />
          </DCArtboard>
          <DCArtboard id="icons" label="Icon sheet · toolbar & favicon" width={540} height={405}>
            <IconSheetBoard />
          </DCArtboard>
          <DCArtboard id="voice" label="Notifications · copy voice" width={520} height={530}>
            <VoiceBoard />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
