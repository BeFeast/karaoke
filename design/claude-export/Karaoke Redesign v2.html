<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Karaoke — Redesign v2 · Marquee</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="karaoke-marquee.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="sections/m-brand.jsx"></script>
<script type="text/babel" src="sections/m-booth.jsx"></script>
<script type="text/babel" src="sections/m-players.jsx"></script>
<script type="text/babel" src="sections/m-perf.jsx"></script>
<script type="text/babel" src="sections/m-doorway.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="Karaoke — redesign v2 · Marquee">
        <DCSection id="brand" title="1 · Marquee identity & naming" subtitle="Your pick: the sign. Lit at night, unlit by day — plus four name candidates">
          <DCArtboard id="pivot" label="Round 2 — answers → moves" width={520} height={560}>
            <PivotBoard />
          </DCArtboard>
          <DCArtboard id="naming" label="Naming — four marquee candidates" width={560} height={560}>
            <NamingBoard />
          </DCArtboard>
          <DCArtboard id="identity" label="Identity system — palette · type · progress" width={520} height={640}>
            <IdentityBoard />
          </DCArtboard>
        </DCSection>

        <DCSection id="booth" title="2 · The Booth — light-first dashboard" subtitle="Operator porn: stage timeline, live cost ticker, cap bar, teardown receipts">
          <DCArtboard id="dashboard" label="Dashboard · trusted LAN" width={1000} height={840}>
            <MBoothBoard />
          </DCArtboard>
        </DCSection>

        <DCSection id="players" title="3 · Player UX — three ways to mix yourself in" subtitle="The variation budget went here. Pick one or hybridize">
          <DCArtboard id="p1" label="P1 · The Console — two faders + DUCK" width={620} height={480}>
            <PlayerConsole />
          </DCArtboard>
          <DCArtboard id="p2" label="P2 · The Dial — one confidence knob" width={460} height={500}>
            <PlayerDial />
          </DCArtboard>
          <DCArtboard id="p3" label="P3 · The Setlist — lyrics are the player" width={620} height={480}>
            <PlayerSetlist />
          </DCArtboard>
        </DCSection>

        <DCSection id="perf" title="4 · Performance mode — phone-first" subtitle="iPhone is the main player; laptop/TV fullscreen second">
          <DCArtboard id="phone" label="iPhone · performance mode" width={440} height={916}>
            <PhonePerfBoard />
          </DCArtboard>
          <DCArtboard id="laptop" label="Laptop / TV · fullscreen" width={960} height={540}>
            <LaptopPerfBoard />
          </DCArtboard>
        </DCSection>

        <DCSection id="doorway" title="5 · The Doorway — extension" subtitle="Click still submits instantly; the popup IS the receipt. Options + icons">
          <DCArtboard id="popup" label="Popup — receipt + tonight" width={340} height={470}>
            <MPopupBoard />
          </DCArtboard>
          <DCArtboard id="options" label="Options page" width={620} height={560}>
            <MOptionsBoard />
          </DCArtboard>
          <DCArtboard id="icons" label="Icons — the sign at 128/48/16" width={540} height={430}>
            <MIconBoard />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
