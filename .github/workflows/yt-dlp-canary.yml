name: yt-dlp canary

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

concurrency:
  group: yt-dlp-canary
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: deployed download canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Submit canary job
        id: canary
        continue-on-error: true
        env:
          KARAOKE_CANARY_BASE_URL: ${{ secrets.KARAOKE_CANARY_BASE_URL }}
          KARAOKE_CANARY_SERVICE_TOKEN: ${{ secrets.KARAOKE_CANARY_SERVICE_TOKEN }}
          KARAOKE_CANARY_URLS: ${{ vars.KARAOKE_CANARY_URLS || 'https://www.youtube.com/watch?v=BaW_jenozKc' }}
          KARAOKE_CANARY_TIMEOUT_SECONDS: ${{ vars.KARAOKE_CANARY_TIMEOUT_SECONDS || '900' }}
          KARAOKE_CANARY_POLL_SECONDS: ${{ vars.KARAOKE_CANARY_POLL_SECONDS || '10' }}
        run: uv run --frozen --no-dev scripts/ytdlp_canary.py
      - name: Open or update failure issue
        if: steps.canary.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "yt-dlp canary failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "Nightly deployed yt-dlp canary failed.",
              "",
              `Run: ${runUrl}`,
              `Workflow: ${context.workflow}`,
              `Ref: ${context.ref}`,
              "",
              "Check the workflow logs for the failed coordinator job status/error.",
            ].join("\n");
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const existing = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            if (existing.data.items.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data.items[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Fail workflow after surfacing canary failure
        if: steps.canary.outcome == 'failure'
        run: exit 1
