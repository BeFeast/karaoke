name: yt-dlp canary

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

concurrency:
  group: yt-dlp-canary
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: deployed download canary
    # Canaries run on Forgejo, the canonical repo (#332). The GitHub copy only
    # mirrors main, so its scheduled runs are skipped instead of probing twice.
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Submit canary job
        id: canary
        continue-on-error: true
        env:
          KARAOKE_CANARY_BASE_URL: ${{ secrets.KARAOKE_CANARY_BASE_URL }}
          KARAOKE_CANARY_SERVICE_TOKEN: ${{ secrets.KARAOKE_CANARY_SERVICE_TOKEN }}
          KARAOKE_CANARY_URLS: ${{ vars.KARAOKE_CANARY_URLS || 'https://www.youtube.com/watch?v=BaW_jenozKc' }}
          KARAOKE_CANARY_TIMEOUT_SECONDS: ${{ vars.KARAOKE_CANARY_TIMEOUT_SECONDS || '900' }}
          KARAOKE_CANARY_POLL_SECONDS: ${{ vars.KARAOKE_CANARY_POLL_SECONDS || '10' }}
        run: uv run --frozen --no-dev scripts/ytdlp_canary.py
      - name: Open or update failure issue
        if: steps.canary.outcome == 'failure'
        env:
          CANARY_ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          body="$(printf '%s\n' \
            "Nightly deployed yt-dlp canary failed." \
            "" \
            "Run: $RUN_URL" \
            "Workflow: $GITHUB_WORKFLOW" \
            "Ref: $GITHUB_REF" \
            "" \
            "Check the workflow logs for the failed coordinator job status/error.")"
          scripts/canary-failure-issue.sh "yt-dlp canary failure" "$body"
      - name: Fail workflow after surfacing canary failure
        if: steps.canary.outcome == 'failure'
        run: exit 1
