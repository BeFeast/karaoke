name: gpu-image

# Manually-triggered build+push of the RunPod GPU worker image (docker/runpod).
# Exists because the homelab hosts build/push this ~7GB image at residential
# speeds (hours); a GitHub runner does it in minutes (#260 was blocked on it).
# NOT part of CI — GPU image cuts are deliberate, supervised operations
# (repoint + warm-worker flush live in scripts/runpod_provision.py, see #75).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. cuda12.4-r10)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is ~7GB compressed / >15GB in layers; stock runners have
      # ~14GB free on /. Drop the big preinstalled toolchains first. The
      # boot-verify step below pulls the whole image back from GHCR, so free
      # more than the build alone needs (ghcup/swift/jvm add ~8GB).
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/.ghcup /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN cannot push: the pre-existing karaoke-runpod package
      # (created by user PAT pushes) never granted this repo's Actions write
      # access, and GitHub has no API for that grant (UI-only). GHCR_TOKEN is
      # an operator PAT with write:packages.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Registry-backed buildkit cache (#263): a handler-only tag bump reuses
      # every heavy layer (~9.4GB ingress otherwise) and pushes ~25KB.
      - uses: docker/build-push-action@v6
        with:
          context: docker/runpod
          platforms: linux/amd64
          push: true
          tags: ghcr.io/befeast/karaoke-runpod:${{ inputs.tag }}
          cache-from: type=registry,ref=ghcr.io/befeast/karaoke-runpod:buildcache
          cache-to: type=registry,ref=ghcr.io/befeast/karaoke-runpod:buildcache,mode=max

      # Boot-verify the JUST-pushed tag (#279; prevents a repeat of #263,
      # where CI overwrote a live-verified tag with an unverified image).
      # Pull it BACK from GHCR — this verifies the registry artifact itself,
      # not local build state — and run the handler's CPU-only selfcheck
      # (heavy imports + baked model files present and plausibly sized).
      # buildx keeps the image layers in its local cache after the build;
      # prune it first so the >15GB pulled image fits the runner disk.
      - name: Free disk for boot-verify pull
        run: |
          docker buildx prune -af
          sudo docker image prune -af
          df -h /

      - name: Boot-verify pushed image (CPU selfcheck)
        run: |
          docker pull ghcr.io/befeast/karaoke-runpod:${{ inputs.tag }}
          docker run --rm ghcr.io/befeast/karaoke-runpod:${{ inputs.tag }} --selfcheck
