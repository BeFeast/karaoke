name: gpu-image

# Manually-triggered build+push of the RunPod GPU worker image (docker/runpod).
# Exists because the homelab hosts build/push this ~7GB image at residential
# speeds (hours); a GitHub runner does it in minutes (#260 was blocked on it).
# NOT part of CI — GPU image cuts are deliberate, supervised operations
# (repoint + warm-worker flush live in scripts/runpod_provision.py, see #75).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. cuda12.4-r10)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is ~7GB compressed / >15GB in layers; stock runners have
      # ~14GB free on /. Drop the big preinstalled toolchains first.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/runpod
          platforms: linux/amd64
          push: true
          tags: ghcr.io/befeast/karaoke-runpod:${{ inputs.tag }}
