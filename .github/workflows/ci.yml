name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen --all-extras --all-groups
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest -q

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karaoke
          POSTGRES_PASSWORD: karaoke
          POSTGRES_DB: karaoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karaoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KARAOKE_DATABASE_URL: postgresql+psycopg://karaoke:karaoke@localhost:5432/karaoke
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen --all-extras --all-groups
      - name: Alembic upgrade head (clean Postgres)
        run: uv run alembic upgrade head

  extension-version-guard:
    name: extension-version-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require manifest version bump on extension changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ext_changed="$(git diff --name-only "$BASE_SHA"...HEAD -- extension/chrome/ \
            | grep -v '^extension/chrome/README\.md$' || true)"
          if [ -z "$ext_changed" ]; then
            echo "No extension/chrome/ changes (beyond README.md) — version bump not required."
            exit 0
          fi
          if git diff "$BASE_SHA"...HEAD -- extension/chrome/manifest.json \
            | grep -E '^[+-][[:space:]]*"version"' >/dev/null; then
            echo 'extension/chrome/ changed and manifest.json "version" was bumped — OK.'
            exit 0
          fi
          echo '::error file=extension/chrome/manifest.json::extension/chrome/ changed without bumping "version" in extension/chrome/manifest.json. Changed files:'
          printf '%s\n' "$ext_changed"
          echo 'Policy: any change under extension/chrome/ (except README.md) must bump the manifest "version". See extension/chrome/README.md.'
          exit 1

  spa:
    name: spa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/spa
    steps:
      - uses: actions/checkout@v4
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Design guards
        run: bun run guards
      - name: Build
        run: bun run build

  # Android submitter app (mobile/android/, issue #169). The job always runs
  # and self-reports success when mobile/android/ is untouched: a change-filter
  # first step + step-level `if:` guards, NOT a workflow/job-level `paths:`
  # filter (a skipped job never reports and would wedge if this check is ever
  # made required).
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect mobile/android changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range_base="$BASE_SHA"
          else
            range_base="$BEFORE_SHA"
          fi
          if [ -z "$range_base" ] \
            || [ "$range_base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$range_base^{commit}" 2>/dev/null; then
            echo "No usable base commit for the diff — building to be safe."
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$range_base"...HEAD -- mobile/android/ || true)"
          if [ -n "$changed" ]; then
            echo "mobile/android/ changed:"
            printf '%s\n' "$changed"
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile/android/ changes — skipping Android build steps."
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK 17
        if: steps.filter.outputs.android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        if: steps.filter.outputs.android == 'true'
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle (cache)
        if: steps.filter.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + lint
        if: steps.filter.outputs.android == 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Assemble debug APK
        if: steps.filter.outputs.android == 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        if: steps.filter.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-submitter-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
