version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      yt-dlp-stack:
        patterns:
          - "yt-dlp"
          - "yt-dlp-ejs"
          - "bgutil-ytdlp-pot-provider"
      python-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "yt-dlp"
          - "yt-dlp-ejs"
          - "bgutil-ytdlp-pot-provider"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
