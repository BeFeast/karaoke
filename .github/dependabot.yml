version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      yt-dlp-stack:
        patterns:
          - "yt-dlp"
          - "yt-dlp-ejs"
          - "bgutil-ytdlp-pot-provider"
