state:
  authenticated_owner: machine_bearer
  youtube_url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
  profiles: [android]
action:
  - submit: youtube_url
    assert:
      owner_authenticated: machine_bearer
      job_submitted: queued
      websocket_completed: 100
      real_gpu_job: runpod-
      synced_lyrics: true
      # Curated lyrics must be confirmed by this job's own transcript (word
      # bigram agreement >= 0.12; other songs measure <= 0.05). Catches
      # another song's text, or this song's text over another song's audio.
      lyrics_match_audio: 0.12
      # Processing (#/job/:token) shows the stages in pipeline order and ends on Start singing.
      processing_stages_in_order: true
      start_singing_visible: true
  - open: booth_sing_link
    assert:
      playback_advances: 0.75
      stem_mix_changes: 0.2
      lyric_highlight_sync: 0.5
      lyric_font_size: {inactive_px: 16, active_px: 20}
      no_horizontal_scroll: true
      controls_reachable: true
  - cleanup: submitted_job
    assert:
      job_and_exports_removed: true
