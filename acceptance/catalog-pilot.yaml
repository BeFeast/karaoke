# Exercise the pilot controls with an isolated database, fake time, and stub providers.
state:
  catalog_fixture: pilot_manifest_with_duplicate_video_id
  pilot_budget: {total_usd: 5.00, daily_usd: 1.00}
  profiles: [desktop]
  cooldown_fixture: prior_pilot_download_started_299_seconds_before_fake_now
action:
  - import_twice: seed_metadata
    assert:
      duplicate_sources: 0
      new_downloads: 0
      new_gpu_jobs: 0
  - run_pilot: while_foreground_download_is_active
    assert:
      pilot_state: waiting_for_foreground
      new_pilot_downloads: 0
  - run_pilot: within_five_minutes_of_previous_pilot_download_start
    assert:
      pilot_state: waiting_for_cooldown
      new_pilot_downloads: 0
  - run_pilot: when_next_reservation_exceeds_remaining_budget
    assert:
      pilot_state: waiting_for_budget
      new_gpu_jobs: 0
  - reserve: from_observed_pilot_ledger
    assert:
      reservation_micros: 118532
      uncertain_charge_influences_reservation: false
  - run_pilot: with_available_budget_and_provider_429
    assert:
      pilot_state: paused
      new_gpu_jobs: 0
      automatic_retries: 0
  - auto_check: complete_and_faulted_exports
    assert:
      all_checks_pass: ready
      any_check_fails: review
      audit_actor: auto-check
  - import: english_and_hebrew_manifest
    assert:
      excluded_asset_hidden: true
      excluded_asset_charge_retained: true
