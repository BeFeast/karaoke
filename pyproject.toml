[project]
name = "karaoke"
version = "0.3.2"
description = "URL → isolated vocals + instrumental playback + lyrics; coordinator on devbox + ephemeral vast.ai GPU."
authors = [
    { name = "Oleg Kossoy", email = "oleg@kossoy.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    # yt-dlp plugin: auto-fetches GVS PO tokens from the bgutil provider sidecar
    # (HTTP server mode) so YouTube web/mweb clients aren't skipped/403'd and the
    # coordinator's residential IP stops tripping the bot-check (issue #68). The
    # provider server itself runs as a separate docker sidecar — see
    # docker/api/README.md.
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.48.0",
    "websockets>=16.0",
    # Known-good YouTube extractor stack. Keep exact pins: the nightly canary
    # catches breakage, and Dependabot opens deliberate bump PRs.
    "yt-dlp==2026.3.17",
    "yt-dlp-ejs==0.8.0",
]

[project.scripts]
karaoke = "karaoke:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
