<!doctype html>
<!-- Doorway popup — the click already submitted; this is the receipt.
     DOM/classes/inline styles ported from design/m-doorway.jsx MPopupBoard
     (lines 4-60), wired to the real submit + GET /jobs feed in popup.js.
     The header mark is the sign-in mic card (#163): the SignInWall rounded
     card scaled from 76px to 20px (radius 20 -> 5, border 2 -> 1) around the
     MicMark glyph verbatim (marks.tsx: 24-viewBox, capsule rect x=9 y=2 w=6
     h=12 rx=3, stroke-width 2, round caps/joins) at the sign-in 38/76 ratio.
     Colors route through the vendored marquee.css tokens. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Karaoke</title>
    <link rel="stylesheet" href="marquee.css">
    <link rel="stylesheet" href="doorway.css">
  </head>
  <body class="doorway-popup">
    <div class="m-booth" style="height: 100%; display: flex; flex-direction: column; font-size: 13px">
      <div style="display: flex; align-items: center; gap: 9px; padding: 11px 14px; border-bottom: 1px solid var(--border)">
        <div style="width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; flex: none; background: var(--bg-card); border: 1px solid var(--accent); box-shadow: var(--shadow)">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" aria-label="Karaoke mark">
            <rect x="9" y="2" width="6" height="12" rx="3" fill="var(--accent)"></rect>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <span style="font-family: var(--font-display); font-weight: 650; font-size: 14px">Karaoke</span>
        <span style="flex: 1"></span>
        <span class="m-chip ok" style="font-size: 10px"><span class="m-dot"></span><span id="booth-host">booth</span></span>
        <button id="open-settings" class="m-btn sm ghost" type="button" title="Settings" style="padding: 2px 6px">⚙</button>
      </div>

      <!-- the receipt — submitted on open, already running; the ✕ dismiss
           hides the whole wrap (#177) -->
      <div id="receipt-wrap" style="padding: 12px 14px 0">
        <div id="receipt" class="m-sign" style="border-color: var(--accent); padding: 11px 13px"></div>
        <div class="m-mono" style="font-size: 10px; color: var(--muted); margin: 7px 2px 0">
          the toolbar click already submitted this tab — this popup is just the receipt
        </div>
      </div>

      <!-- tonight -->
      <div style="padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1">
        <div class="m-mono" style="font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted)">tonight</div>
        <div id="feed" style="display: contents"></div>
        <div class="m-mono" style="margin-top: auto; font-size: 10.5px; color: var(--muted); display: flex; justify-content: space-between">
          <a id="open-booth" href="#" target="_blank" style="color: var(--accent); text-decoration: none">open the booth →</a>
          <span id="version"></span>
        </div>
      </div>
    </div>
    <!-- module: popup.js imports the pure receipt formatter (receipt.js, #177) -->
    <script type="module" src="popup.js"></script>
  </body>
</html>
